[project]
name = "gis-jilishte"
version = "0.1.0"
description = "Sofia apartment location recommender using GIS data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "shapely>=2.0",
    "orjson>=3.9",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
